<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" role="img" aria-labelledby="t d">
  <title id="t">WhatsApp order confirmation on a phone</title>
  <desc id="d">A customer receives an order confirmation from the shop on WhatsApp and replies with thanks.</desc>
  <defs>
    <pattern id="wall" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#efe7dc"/>
      <circle cx="10" cy="10" r="1.6" fill="#e2d6c6"/>
      <circle cx="30" cy="28" r="1.6" fill="#e2d6c6"/>
    </pattern>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="300" height="600" rx="44" fill="#0f172a" filter="url(#sh)"/>
  <rect x="22" y="22" width="276" height="576" rx="34" fill="url(#wall)"/>
  <!-- header -->
  <path d="M22 56 a34 34 0 0 1 34 -34 h208 a34 34 0 0 1 34 34 v52 h-276 z" fill="#075e54"/>
  <rect x="122" y="30" width="76" height="18" rx="9" fill="#0f172a"/>
  <circle cx="58" cy="84" r="16" fill="#10b981"/>
  <text x="58" y="89" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#fff">NB</text>
  <text x="84" y="81" font-family="ui-monospace,monospace" font-size="13" font-weight="700" fill="#fff">Nusrat Boutique</text>
  <text x="84" y="97" font-family="ui-monospace,monospace" font-size="10" fill="#b2dfdb">Business account</text>

  <g font-family="ui-monospace,monospace" font-size="11">
    <!-- date chip -->
    <rect x="128" y="124" width="64" height="20" rx="6" fill="#ffffff" opacity=".85"/>
    <text x="160" y="138" text-anchor="middle" fill="#64748b" font-size="10">TODAY</text>

    <!-- customer message -->
    <rect x="96" y="158" width="190" height="52" rx="10" fill="#d9fdd3"/>
    <text x="108" y="180" fill="#0f172a">Apu, M size red kurti</text>
    <text x="108" y="196" fill="#0f172a">ta order korte chai</text>
    <text x="276" y="206" text-anchor="end" fill="#64748b" font-size="9">10:12</text>

    <!-- shop confirmation (template) -->
    <rect x="34" y="226" width="222" height="148" rx="10" fill="#ffffff"/>
    <text x="46" y="250" fill="#0f172a" font-weight="700">Assalamu Alaikum!</text>
    <text x="46" y="270" fill="#0f172a">Your order #SP-1024 has</text>
    <text x="46" y="286" fill="#0f172a">been confirmed.</text>
    <text x="46" y="308" fill="#0f172a">Total: <tspan font-weight="700">৳1,250</tspan></text>
    <text x="46" y="330" fill="#0f172a">Thank you for shopping</text>
    <text x="46" y="346" fill="#0f172a">with Nusrat Boutique.</text>
    <text x="244" y="366" text-anchor="end" fill="#64748b" font-size="9">10:15 <tspan fill="#34b7f1">✓✓</tspan></text>

    <!-- shipped -->
    <rect x="34" y="390" width="222" height="76" rx="10" fill="#ffffff"/>
    <text x="46" y="414" fill="#0f172a">Your order #SP-1024 has</text>
    <text x="46" y="430" fill="#0f172a">been shipped. Payable on</text>
    <text x="46" y="446" fill="#0f172a">delivery: <tspan font-weight="700">৳1,250</tspan></text>
    <text x="244" y="460" text-anchor="end" fill="#64748b" font-size="9">16:40 <tspan fill="#34b7f1">✓✓</tspan></text>

    <!-- customer reply -->
    <rect x="150" y="482" width="136" height="38" rx="10" fill="#d9fdd3"/>
    <text x="162" y="505" fill="#0f172a">Thank you! 🙏</text>
    <text x="276" y="514" text-anchor="end" fill="#64748b" font-size="9">16:42</text>
  </g>

  <!-- input bar -->
  <rect x="34" y="546" width="208" height="36" rx="18" fill="#ffffff"/>
  <text x="52" y="569" font-family="ui-monospace,monospace" font-size="11" fill="#94a3b8">Message</text>
  <circle cx="266" cy="564" r="18" fill="#10b981"/>
  <path d="M259 556 L276 564 L259 572 L262 564 Z" fill="#fff"/>
</svg>
